</header><main class="wrap"><h1>Search Cultural India</h1><p>Search heritage, culture, food and festivals in the prototype.</p><input id="q" style="width:70%;padding:14px;border:1px solid #cdbda7;border-radius:8px" placeholder="Try Somnath Temple, Garba, Khaman..."> <button class="btn" onclick="go()">Search</button><div id="out" class="grid" style="grid-template-columns:1fr"></div></main><script>const d=[["Somnath Temple","Heritage","heritage-detail.html?place=somnath-temple"],["Sabarmati Ashram","Heritage","heritage-detail.html?place=sabarmati-ashram"],["Adalaj Stepwell","Heritage","heritage-detail.html?place=adalaj-stepwell"],["Bhadra Fort","Heritage","heritage-detail.html?place=bhadra-fort"],["Sidi Saiyyed Mosque","Heritage","heritage-detail.html?place=sidi-saiyyed-mosque"],["Garba","Culture","culture.html"],["Gujarati Food","Food","food.html"],["Navratri","Festival","festivals.html"]];function go(){let q=document.getElementById('q').value.toLowerCase().trim(),a=d.filter(x=>x.join(' ').toLowerCase().includes(q));document.getElementById('out').innerHTML=(a.length?a:d).map(x=>`<article class="card"><div><h2>${x[0]}</h2><p>${x[1]}</p><a class="btn" href="${x[2]}">Explore →</a></div></article>`).join('')}go()</script><script src="assets/js/common-nav.js"></script></body></html>
